<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#05030a"/>
      <stop offset="50%" style="stop-color:#0d0518"/>
      <stop offset="100%" style="stop-color:#05030a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a0035"/>
      <stop offset="25%" style="stop-color:#5a0080"/>
      <stop offset="50%" style="stop-color:#8b2be2"/>
      <stop offset="75%" style="stop-color:#5a0080"/>
      <stop offset="100%" style="stop-color:#1a0035"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#05030a;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#5a0080;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#8b2be2;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#5a0080;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#05030a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="voidglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#8b2be2;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#05030a;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-purple">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#5a0080" stroke-width="0.2" opacity="0.12"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#5a0080" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#dots)"/>
  <rect width="900" height="300" fill="url(#voidglow)"/>

  <!-- Side borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#purple)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#purple)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Hex circle background -->
  <circle cx="450" cy="130" r="90" fill="none" stroke="#5a0080" stroke-width="0.8" opacity="0.25"/>
  <circle cx="450" cy="130" r="75" fill="none" stroke="#5a0080" stroke-width="0.4" opacity="0.15"/>
  <!-- Hexagram lines -->
  <g stroke="#5a0080" stroke-width="0.6" opacity="0.1">
    <line x1="450" y1="42" x2="450" y2="218"/>
    <line x1="363" y1="88" x2="537" y2="172"/>
    <line x1="363" y1="172" x2="537" y2="88"/>
  </g>

  <!-- Corner ornaments -->
  <g stroke="#5a0080" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <path d="M36,20 L36,28 M20,36 L28,36"/>
    <circle cx="20" cy="20" r="3" fill="#5a0080" stroke="none" opacity="0.8"/>
    <circle cx="36" cy="20" r="1.5" fill="#5a0080" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#5a0080" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <path d="M864,20 L864,28 M880,36 L872,36"/>
    <circle cx="880" cy="20" r="3" fill="#5a0080" stroke="none" opacity="0.8"/>
    <circle cx="864" cy="20" r="1.5" fill="#5a0080" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#5a0080" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#5a0080" stroke="none" opacity="0.8"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#5a0080" stroke="none" opacity="0.8"/>
  </g>

  <!-- Shadow wisps top -->
  <g fill="#5a0080" opacity="0.2">
    <ellipse cx="180" cy="2" rx="2" ry="9"/>
    <ellipse cx="310" cy="2" rx="1.5" ry="13"/>
    <ellipse cx="590" cy="2" rx="1.5" ry="11"/>
    <ellipse cx="720" cy="2" rx="2" ry="8"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#2a0050" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- WARLOCK SUBCLASS badge -->
  <rect x="330" y="66" width="240" height="24" rx="2" fill="#0d0520" opacity="0.9"/>
  <rect x="330" y="66" width="240" height="24" rx="2" fill="none" stroke="#5a0080" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#8b2be2" letter-spacing="4">WARLOCK SUBCLASS</text>

  <!-- Main title -->
  <text x="450" y="158" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="72" font-weight="bold" fill="url(#purple)" filter="url(#glow-purple)" letter-spacing="8">HEXBLADE</text>

  <!-- Subtitle -->
  <text x="450" y="183" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#5a0080" letter-spacing="5" opacity="0.9">SHADOW PACT · CURSED BLADE · VOID MANIFEST</text>

  <!-- Bottom separator -->
  <rect x="100" y="200" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#2a0050">
    <text x="180" y="228" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#8b2be2" filter="url(#glow-soft)">d8</text>

    <line x1="265" y1="215" x2="265" y2="255" stroke="#5a0080" stroke-width="0.6" opacity="0.4"/>

    <text x="345" y="228" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b2be2">LEVEL 3</text>

    <line x1="420" y1="215" x2="420" y2="255" stroke="#5a0080" stroke-width="0.6" opacity="0.4"/>

    <text x="450" y="225" text-anchor="middle" font-size="11" letter-spacing="1">SAVES</text>
    <text x="450" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b2be2">WIS · CHA</text>

    <line x1="490" y1="215" x2="490" y2="255" stroke="#5a0080" stroke-width="0.6" opacity="0.4"/>

    <text x="570" y="228" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="570" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#8b2be2">CHA</text>

    <line x1="645" y1="215" x2="645" y2="255" stroke="#5a0080" stroke-width="0.6" opacity="0.4"/>

    <text x="725" y="228" text-anchor="middle" font-size="11" letter-spacing="1">NEW FEATURES</text>
    <text x="725" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#8b2be2" filter="url(#glow-soft)">8</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#2a0050" font-style="italic">
    "The sword chose you. Now make your enemies regret it."
  </text>
</svg>
