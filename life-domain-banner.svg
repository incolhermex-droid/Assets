<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020a03"/>
      <stop offset="50%" style="stop-color:#041505"/>
      <stop offset="100%" style="stop-color:#020a03"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#012010"/>
      <stop offset="25%" style="stop-color:#0a6030"/>
      <stop offset="50%" style="stop-color:#18a855"/>
      <stop offset="75%" style="stop-color:#0a6030"/>
      <stop offset="100%" style="stop-color:#012010"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020a03;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#0a6030;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#18a855;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#0a6030;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#020a03;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lifeglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#18a855;stop-opacity:0.13"/>
      <stop offset="100%" style="stop-color:#020a03;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-emerald">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#0a6030" stroke-width="0.2" opacity="0.13"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#lifeglow)"/>

  <!-- Borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#emerald)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#emerald)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Caduceus / life symbol -->
  <circle cx="450" cy="128" r="85" fill="none" stroke="#0a6030" stroke-width="0.8" opacity="0.22"/>
  <circle cx="450" cy="128" r="65" fill="none" stroke="#0a6030" stroke-width="0.4" opacity="0.13"/>
  <!-- Heartbeat line -->
  <polyline points="320,128 370,128 385,95 400,158 415,110 430,145 445,128 540,128" fill="none" stroke="#0a6030" stroke-width="0.8" opacity="0.18" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Corner ornaments -->
  <g stroke="#0a6030" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#0a6030" stroke="none" opacity="0.8"/>
    <circle cx="36" cy="20" r="1.5" fill="#0a6030" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#0a6030" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#0a6030" stroke="none" opacity="0.8"/>
    <circle cx="864" cy="20" r="1.5" fill="#0a6030" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#0a6030" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#0a6030" stroke="none" opacity="0.8"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#0a6030" stroke="none" opacity="0.8"/>
  </g>

  <!-- Life sparks top -->
  <g fill="#18a855" opacity="0.18">
    <ellipse cx="200" cy="2" rx="1.5" ry="10"/>
    <ellipse cx="320" cy="2" rx="2" ry="8"/>
    <ellipse cx="580" cy="2" rx="1.5" ry="12"/>
    <ellipse cx="700" cy="2" rx="2" ry="9"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#012010" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- CLERIC DOMAIN badge -->
  <rect x="320" y="66" width="260" height="24" rx="2" fill="#020a03" opacity="0.9"/>
  <rect x="320" y="66" width="260" height="24" rx="2" fill="none" stroke="#0a6030" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#18a855" letter-spacing="4">CLERIC DOMAIN</text>

  <!-- Main title -->
  <text x="450" y="155" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="72" font-weight="bold" fill="url(#emerald)" filter="url(#glow-emerald)" letter-spacing="8">LIFE</text>

  <!-- Subtitle -->
  <text x="450" y="180" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#0a6030" letter-spacing="5" opacity="0.9">PRESERVE · RESTORE · ENDURE</text>

  <!-- Bottom separator -->
  <rect x="100" y="198" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#012010">
    <text x="180" y="226" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#18a855" filter="url(#glow-soft)">d8</text>

    <line x1="265" y1="213" x2="265" y2="253" stroke="#0a6030" stroke-width="0.6" opacity="0.4"/>

    <text x="345" y="226" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#18a855">LEVEL 3</text>

    <line x1="420" y1="213" x2="420" y2="253" stroke="#0a6030" stroke-width="0.6" opacity="0.4"/>

    <text x="450" y="223" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="450" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#18a855">WIS</text>

    <line x1="490" y1="213" x2="490" y2="253" stroke="#0a6030" stroke-width="0.6" opacity="0.4"/>

    <text x="570" y="226" text-anchor="middle" font-size="11" letter-spacing="1">CHANNEL DIV.</text>
    <text x="570" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#18a855">PRESERVE LIFE</text>

    <line x1="645" y1="213" x2="645" y2="253" stroke="#0a6030" stroke-width="0.6" opacity="0.4"/>

    <text x="725" y="226" text-anchor="middle" font-size="11" letter-spacing="1">SPELLS ADDED</text>
    <text x="725" y="246" text-anchor="middle" font-size="20" font-weight="bold" fill="#18a855" filter="url(#glow-soft)">9</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#012010" font-style="italic">
    "They fall. You decide if that's permanent."
  </text>
</svg>
