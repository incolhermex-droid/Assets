<svg xmlns="http://www.w3.org/2000/svg" width="680" height="90" viewBox="0 0 680 90">
  <defs>
    <pattern id="cs-pulse" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="8" fill="none" stroke="#1A1A3A" stroke-width="0.5" opacity="0.5"/>
      <circle cx="20" cy="20" r="15" fill="none" stroke="#1A1A3A" stroke-width="0.3" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="680" height="90" fill="#08080F"/>
  <rect width="680" height="90" fill="url(#cs-pulse)"/>
  <rect x="0" y="0" width="680" height="2" fill="#7F8C8D" opacity="0.7"/>
  <rect x="0" y="88" width="680" height="2" fill="#7F8C8D" opacity="0.7"/>
  <!-- dashed border suggesting "in progress" -->
  <rect x="40" y="14" width="600" height="62" fill="none" stroke="#4A4A6A" stroke-width="0.8" opacity="0.5" stroke-dasharray="6,4"/>
  <!-- ellipsis dots -->
  <circle cx="316" cy="70" r="2.5" fill="#7F8C8D" opacity="0.5"/>
  <circle cx="330" cy="70" r="2.5" fill="#7F8C8D" opacity="0.5"/>
  <circle cx="344" cy="70" r="2.5" fill="#7F8C8D" opacity="0.5"/>
  <circle cx="358" cy="70" r="2.5" fill="#7F8C8D" opacity="0.5"/>
  <text x="340" y="38" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#95A5A6" letter-spacing="6" opacity="0.75">ON THE HORIZON</text>
  <text x="340" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="26" fill="#BDC3C7" letter-spacing="4" font-weight="bold">COMING SOON</text>
</svg>
