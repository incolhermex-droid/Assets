<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0600"/>
      <stop offset="50%" style="stop-color:#180d00"/>
      <stop offset="100%" style="stop-color:#0a0600"/>
    </linearGradient>
    <linearGradient id="solar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a1500"/>
      <stop offset="25%" style="stop-color:#c06000"/>
      <stop offset="50%" style="stop-color:#ffaa00"/>
      <stop offset="75%" style="stop-color:#c06000"/>
      <stop offset="100%" style="stop-color:#2a1500"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0600;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#c06000;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#ffaa00;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#c06000;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0a0600;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="sunglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#ffaa00;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#0a0600;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-solar">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#c06000" stroke-width="0.2" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#sunglow)"/>

  <!-- Borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#solar)" opacity="0.9"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#solar)" opacity="0.9"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Sun rays -->
  <circle cx="450" cy="128" r="88" fill="none" stroke="#c06000" stroke-width="0.8" opacity="0.22"/>
  <circle cx="450" cy="128" r="68" fill="none" stroke="#c06000" stroke-width="0.4" opacity="0.14"/>
  <g stroke="#c06000" stroke-width="0.8" opacity="0.15" stroke-linecap="round">
    <line x1="450" y1="28" x2="450" y2="78"/>
    <line x1="450" y1="178" x2="450" y2="228"/>
    <line x1="350" y1="128" x2="400" y2="128"/>
    <line x1="500" y1="128" x2="550" y2="128"/>
    <line x1="379" y1="57" x2="414" y2="92"/>
    <line x1="486" y1="164" x2="521" y2="199"/>
    <line x1="521" y1="57" x2="486" y2="92"/>
    <line x1="414" y1="164" x2="379" y2="199"/>
    <line x1="362" y1="88" x2="390" y2="108"/>
    <line x1="510" y1="148" x2="538" y2="168"/>
    <line x1="538" y1="88" x2="510" y2="108"/>
    <line x1="390" y1="148" x2="362" y2="168"/>
  </g>

  <!-- Corner ornaments -->
  <g stroke="#c06000" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#c06000" stroke="none" opacity="0.9"/>
    <circle cx="36" cy="20" r="1.5" fill="#c06000" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#c06000" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#c06000" stroke="none" opacity="0.9"/>
    <circle cx="864" cy="20" r="1.5" fill="#c06000" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#c06000" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#c06000" stroke="none" opacity="0.9"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#c06000" stroke="none" opacity="0.9"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#2a1500" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- CLERIC DOMAIN badge -->
  <rect x="320" y="66" width="260" height="24" rx="2" fill="#0a0600" opacity="0.9"/>
  <rect x="320" y="66" width="260" height="24" rx="2" fill="none" stroke="#c06000" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#ffaa00" letter-spacing="4">CLERIC DOMAIN</text>

  <!-- Main title -->
  <text x="450" y="157" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="78" font-weight="bold" fill="url(#solar)" filter="url(#glow-solar)" letter-spacing="10">LIGHT</text>

  <!-- Subtitle -->
  <text x="450" y="182" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#c06000" letter-spacing="5" opacity="0.9">RADIANCE · WARDING FLARE · SACRED DAWN</text>

  <!-- Bottom separator -->
  <rect x="100" y="200" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#2a1500">
    <text x="180" y="228" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffaa00" filter="url(#glow-soft)">d8</text>

    <line x1="265" y1="215" x2="265" y2="255" stroke="#c06000" stroke-width="0.6" opacity="0.4"/>

    <text x="345" y="228" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffaa00">LEVEL 3</text>

    <line x1="420" y1="215" x2="420" y2="255" stroke="#c06000" stroke-width="0.6" opacity="0.4"/>

    <text x="450" y="225" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="450" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffaa00">WIS</text>

    <line x1="490" y1="215" x2="490" y2="255" stroke="#c06000" stroke-width="0.6" opacity="0.4"/>

    <text x="570" y="228" text-anchor="middle" font-size="11" letter-spacing="1">REACTION</text>
    <text x="570" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffaa00">WARDING FLARE</text>

    <line x1="645" y1="215" x2="645" y2="255" stroke="#c06000" stroke-width="0.6" opacity="0.4"/>

    <text x="725" y="228" text-anchor="middle" font-size="11" letter-spacing="1">SPELLS ADDED</text>
    <text x="725" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#ffaa00" filter="url(#glow-soft)">10</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#2a1500" font-style="italic">
    "In the dark, you are not hidden. You are a target. A very bright one."
  </text>
</svg>
