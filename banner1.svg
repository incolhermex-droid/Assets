<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fadeEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="10%" stop-color="white" stop-opacity="1"/>
      <stop offset="90%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7a5f2a"/>
      <stop offset="40%" style="stop-color:#e8c97a"/>
      <stop offset="60%" style="stop-color:#c9a84c"/>
      <stop offset="100%" style="stop-color:#7a5f2a"/>
    </linearGradient>
    <linearGradient id="line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0b09;stop-opacity:1"/>
      <stop offset="30%" style="stop-color:#c9a84c;stop-opacity:1"/>
      <stop offset="70%" style="stop-color:#c9a84c;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0b09;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- Decorative corner ornaments -->
  <g stroke="#c9a84c" stroke-width="1" fill="none" opacity="0.4">
    <path d="M20,20 L50,20 L50,22 M20,20 L20,50 L22,50"/>
    <path d="M880,20 L850,20 L850,22 M880,20 L880,50 L878,50"/>
    <path d="M20,180 L50,180 L50,178 M20,180 L20,150 L22,150"/>
    <path d="M880,180 L850,180 L850,178 M880,180 L880,150 L878,150"/>
  </g>

  <!-- Top decorative line -->
  <rect x="60" y="38" width="780" height="1" fill="url(#line)" opacity="0.6"/>

  <!-- Rune row top -->
  <text x="450" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#7a5f2a" letter-spacing="8">✦ BALDUR'S GATE III ✦</text>

  <!-- Main title -->
  <text x="450" y="100" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="bold" fill="url(#gold)" filter="url(#glow)" letter-spacing="2">DnD 5.5e All-in-One BEYOND</text>

  <!-- Subtitle -->
  <text x="450" y="132" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c9a84c" letter-spacing="1" opacity="0.85">THE WORLD UPDATE</text>

  <!-- Bottom decorative line -->
  <rect x="60" y="152" width="780" height="1" fill="url(#line)" opacity="0.6"/>

  <!-- Tagline -->
  <text x="450" y="172" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7a5f2a" font-style="italic" letter-spacing="1">The most complete 2024 ruleset overhaul for Baldur's Gate 3</text>

  <!-- Bottom rune -->
  <text x="450" y="190" text-anchor="middle" font-family="Georgia, serif" font-size="10" fill="#4a3a1a" letter-spacing="6">⚔ ✦ ⚔</text>
</svg>
