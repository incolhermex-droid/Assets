<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="50%" style="stop-color:#060a12"/>
      <stop offset="100%" style="stop-color:#030508"/>
    </linearGradient>
    <linearGradient id="steel-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#080f20"/>
      <stop offset="25%" style="stop-color=#304878"/>
      <stop offset="50%" style="stop-color:#5878c8"/>
      <stop offset="75%" style="stop-color:#304878"/>
      <stop offset="100%" style="stop-color:#080f20"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#030508;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#304878;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#5878c8;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#304878;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#030508;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#304878" stroke-width="0.2" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <!-- Blade slash marks -->
  <g stroke="#304878" stroke-width="1" opacity="0.18" stroke-linecap="round">
    <line x1="370" y1="55" x2="530" y2="201"/>
    <line x1="380" y1="55" x2="540" y2="201"/>
  </g>
  <circle cx="450" cy="128" r="85" fill="none" stroke="#304878" stroke-width="0.6" opacity="0.2"/>
  <circle cx="450" cy="128" r="60" fill="none" stroke="#304878" stroke-width="0.3" opacity="0.12"/>
  <rect x="0" y="0" width="3" height="300" fill="url(#steel-blue)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#steel-blue)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <g stroke="#304878" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#304878" stroke="none"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#304878" stroke="none"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <circle cx="20" cy="280" r="3" fill="#304878" stroke="none"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <circle cx="880" cy="280" r="3" fill="#304878" stroke="none"/>
  </g>
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#080f20" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>
  <rect x="305" y="66" width="290" height="24" rx="2" fill="#030508" opacity="0.9"/>
  <rect x="305" y="66" width="290" height="24" rx="2" fill="none" stroke="#304878" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#5878c8" letter-spacing="4">MONASTIC TRADITION</text>
  <text x="450" y="148" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="52" font-weight="bold" fill="url(#steel-blue)" filter="url(#glow)" letter-spacing="5">WAY OF THE KENSEI</text>
  <text x="450" y="176" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#304878" letter-spacing="5" opacity="0.9">KENSEI WEAPONS · DEFT STRIKE · SHARPEN THE BLADE</text>
  <rect x="100" y="195" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#080f20">
    <text x="180" y="223" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#5878c8" filter="url(#glow-soft)">d8</text>
    <line x1="265" y1="210" x2="265" y2="252" stroke="#304878" stroke-width="0.6" opacity="0.4"/>
    <text x="345" y="223" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#5878c8">LEVEL 3</text>
    <line x1="420" y1="210" x2="420" y2="252" stroke="#304878" stroke-width="0.6" opacity="0.4"/>
    <text x="450" y="220" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#5878c8">DEX · WIS</text>
    <line x1="490" y1="210" x2="490" y2="252" stroke="#304878" stroke-width="0.6" opacity="0.4"/>
    <text x="570" y="223" text-anchor="middle" font-size="11" letter-spacing="1">KEY FEATURE</text>
    <text x="570" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#5878c8">SHARPEN THE BLADE</text>
    <line x1="645" y1="210" x2="645" y2="252" stroke="#304878" stroke-width="0.6" opacity="0.4"/>
    <text x="725" y="223" text-anchor="middle" font-size="11" letter-spacing="1">FEATURES</text>
    <text x="725" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#5878c8" filter="url(#glow-soft)">4</text>
  </g>
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#080f20" font-style="italic">
    "The sword is not separate from the monk. It is the monk, extended."
  </text>
</svg>
