<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050208"/>
      <stop offset="50%" style="stop-color:#0a0412"/>
      <stop offset="100%" style="stop-color:#050208"/>
    </linearGradient>
    <linearGradient id="eldritch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#150030"/>
      <stop offset="20%" style="stop-color:#4800a0"/>
      <stop offset="50%" style="stop-color:#c040f0"/>
      <stop offset="80%" style="stop-color:#4800a0"/>
      <stop offset="100%" style="stop-color:#150030"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#050208;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#4800a0;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#c040f0;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#4800a0;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#050208;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="voidglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#c040f0;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#050208;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-eldritch">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#4800a0" stroke-width="0.2" opacity="0.15"/>
    </pattern>
    <pattern id="runes" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="0.7" fill="#c040f0" opacity="0.18"/>
      <circle cx="28" cy="32" r="0.5" fill="#4800a0" opacity="0.22"/>
      <circle cx="35" cy="8" r="0.6" fill="#c040f0" opacity="0.12"/>
      <circle cx="15" cy="35" r="0.4" fill="#c040f0" opacity="0.15"/>
      <circle cx="32" cy="18" r="0.3" fill="#4800a0" opacity="0.18"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#runes)"/>
  <rect width="900" height="300" fill="url(#voidglow)"/>

  <!-- Borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#eldritch)" opacity="0.9"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#eldritch)" opacity="0.9"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Outer circle + inner circles -->
  <circle cx="450" cy="128" r="95" fill="none" stroke="#4800a0" stroke-width="0.8" opacity="0.22"/>
  <circle cx="450" cy="128" r="72" fill="none" stroke="#4800a0" stroke-width="0.5" opacity="0.15"/>
  <circle cx="450" cy="128" r="48" fill="none" stroke="#4800a0" stroke-width="0.3" opacity="0.1"/>
  <!-- Invocation star rays — 8 pointed -->
  <g stroke="#4800a0" stroke-width="0.6" opacity="0.13">
    <line x1="450" y1="33" x2="450" y2="223"/>
    <line x1="355" y1="128" x2="545" y2="128"/>
    <line x1="382" y1="61" x2="518" y2="195"/>
    <line x1="518" y1="61" x2="382" y2="195"/>
    <line x1="363" y1="95" x2="537" y2="161"/>
    <line x1="537" y1="95" x2="363" y2="161"/>
    <line x1="371" y1="48" x2="529" y2="208"/>
    <line x1="529" y1="48" x2="371" y2="208"/>
  </g>

  <!-- Corner ornaments -->
  <g stroke="#4800a0" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#4800a0" stroke="none" opacity="0.9"/>
    <circle cx="36" cy="20" r="1.5" fill="#4800a0" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#4800a0" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#4800a0" stroke="none" opacity="0.9"/>
    <circle cx="864" cy="20" r="1.5" fill="#4800a0" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#4800a0" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#4800a0" stroke="none" opacity="0.9"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#4800a0" stroke="none" opacity="0.9"/>
  </g>

  <!-- Void wisps -->
  <g fill="#c040f0" opacity="0.15">
    <ellipse cx="170" cy="2" rx="1.5" ry="12"/>
    <ellipse cx="295" cy="2" rx="2" ry="9"/>
    <ellipse cx="505" cy="2" rx="1.5" ry="14"/>
    <ellipse cx="730" cy="2" rx="2" ry="10"/>
    <ellipse cx="130" cy="2" rx="1" ry="7"/>
    <ellipse cx="770" cy="2" rx="1" ry="8"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#150030" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- WARLOCK CLASS badge -->
  <rect x="320" y="66" width="260" height="24" rx="2" fill="#050208" opacity="0.9"/>
  <rect x="320" y="66" width="260" height="24" rx="2" fill="none" stroke="#4800a0" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#c040f0" letter-spacing="4">WARLOCK · CLASS FEATURE</text>

  <!-- Main title -->
  <text x="450" y="145" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="44" font-weight="bold" fill="url(#eldritch)" filter="url(#glow-eldritch)" letter-spacing="4">ELDRITCH INVOCATIONS</text>

  <!-- Subtitle -->
  <text x="450" y="173" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#4800a0" letter-spacing="5" opacity="0.9">PACT BOONS · BLAST SHAPES · ARCANE SECRETS</text>

  <!-- Bottom separator -->
  <rect x="100" y="192" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#150030">
    <text x="180" y="220" text-anchor="middle" font-size="11" letter-spacing="1">FIRST AVAILABLE</text>
    <text x="180" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#c040f0" filter="url(#glow-soft)">LVL 1</text>

    <line x1="265" y1="207" x2="265" y2="250" stroke="#4800a0" stroke-width="0.6" opacity="0.4"/>

    <text x="345" y="220" text-anchor="middle" font-size="11" letter-spacing="1">TOTAL AVAILABLE</text>
    <text x="345" y="240" text-anchor="middle" font-size="20" font-weight="bold" fill="#c040f0" filter="url(#glow-soft)">20+</text>

    <line x1="420" y1="207" x2="420" y2="250" stroke="#4800a0" stroke-width="0.6" opacity="0.4"/>

    <text x="450" y="220" text-anchor="middle" font-size="11" letter-spacing="1">PACT BOONS</text>
    <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#c040f0">BLADE · CHAIN · TOME</text>

    <line x1="490" y1="207" x2="490" y2="250" stroke="#4800a0" stroke-width="0.6" opacity="0.4"/>

    <text x="570" y="220" text-anchor="middle" font-size="11" letter-spacing="1">MAX LEVEL</text>
    <text x="570" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#c040f0">LEVEL 12</text>

    <line x1="645" y1="207" x2="645" y2="250" stroke="#4800a0" stroke-width="0.6" opacity="0.4"/>

    <text x="725" y="220" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKED AT</text>
    <text x="725" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#c040f0">1·2·5·7·9·12</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#150030" font-style="italic">
    "The pact gives you power. The invocations decide what you do with it."
  </text>
</svg>
