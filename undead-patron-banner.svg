<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020a04"/>
      <stop offset="50%" style="stop-color:#041208"/>
      <stop offset="100%" style="stop-color:#020a04"/>
    </linearGradient>
    <linearGradient id="corpse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#001a08"/>
      <stop offset="25%" style="stop-color:#0a4020"/>
      <stop offset="50%" style="stop-color:#1a6e3a"/>
      <stop offset="75%" style="stop-color:#0a4020"/>
      <stop offset="100%" style="stop-color:#001a08"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020a04;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#0a4020;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#1a6e3a;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#0a4020;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#020a04;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="deathglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#1a6e3a;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#020a04;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-corpse">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#0a4020" stroke-width="0.2" opacity="0.15"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#0a4020" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#dots)"/>
  <rect width="900" height="300" fill="url(#deathglow)"/>

  <!-- Side borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#corpse)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#corpse)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Skull-like circle decoration -->
  <circle cx="450" cy="130" r="92" fill="none" stroke="#0a4020" stroke-width="0.8" opacity="0.3"/>
  <circle cx="450" cy="130" r="78" fill="none" stroke="#0a4020" stroke-width="0.4" opacity="0.18"/>
  <!-- Bone cross lines -->
  <g stroke="#0a4020" stroke-width="0.5" opacity="0.1">
    <line x1="360" y1="130" x2="540" y2="130"/>
    <line x1="450" y1="40" x2="450" y2="220"/>
    <line x1="385" y1="65" x2="515" y2="195"/>
    <line x1="515" y1="65" x2="385" y2="195"/>
  </g>

  <!-- Corner ornaments -->
  <g stroke="#0a4020" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <path d="M36,20 L36,28 M20,36 L28,36"/>
    <circle cx="20" cy="20" r="3" fill="#0a4020" stroke="none" opacity="0.8"/>
    <circle cx="36" cy="20" r="1.5" fill="#0a4020" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#0a4020" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <path d="M864,20 L864,28 M880,36 L872,36"/>
    <circle cx="880" cy="20" r="3" fill="#0a4020" stroke="none" opacity="0.8"/>
    <circle cx="864" cy="20" r="1.5" fill="#0a4020" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#0a4020" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#0a4020" stroke="none" opacity="0.8"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#0a4020" stroke="none" opacity="0.8"/>
  </g>

  <!-- Will-o'-wisp wisps top -->
  <g fill="#1a6e3a" opacity="0.18">
    <ellipse cx="190" cy="2" rx="2" ry="10"/>
    <ellipse cx="300" cy="2" rx="1.5" ry="14"/>
    <ellipse cx="600" cy="2" rx="1.5" ry="12"/>
    <ellipse cx="710" cy="2" rx="2" ry="8"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#052010" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- WARLOCK SUBCLASS badge -->
  <rect x="330" y="66" width="240" height="24" rx="2" fill="#020a04" opacity="0.9"/>
  <rect x="330" y="66" width="240" height="24" rx="2" fill="none" stroke="#0a4020" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#1a6e3a" letter-spacing="4">WARLOCK SUBCLASS</text>

  <!-- Main title -->
  <text x="450" y="158" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="58" font-weight="bold" fill="url(#corpse)" filter="url(#glow-corpse)" letter-spacing="6">UNDEAD PATRON</text>

  <!-- Subtitle -->
  <text x="450" y="183" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#0a4020" letter-spacing="5" opacity="0.9">LICH · VAMPIRE · ANCIENT DEATH · PROFANE KNOWLEDGE</text>

  <!-- Bottom separator -->
  <rect x="100" y="200" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#052010">
    <text x="180" y="228" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a6e3a" filter="url(#glow-soft)">d8</text>

    <line x1="265" y1="215" x2="265" y2="255" stroke="#0a4020" stroke-width="0.6" opacity="0.4"/>

    <text x="345" y="228" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a6e3a">LEVEL 3</text>

    <line x1="420" y1="215" x2="420" y2="255" stroke="#0a4020" stroke-width="0.6" opacity="0.4"/>

    <text x="450" y="225" text-anchor="middle" font-size="11" letter-spacing="1">SAVES</text>
    <text x="450" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a6e3a">WIS · CHA</text>

    <line x1="490" y1="215" x2="490" y2="255" stroke="#0a4020" stroke-width="0.6" opacity="0.4"/>

    <text x="570" y="228" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="570" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a6e3a">CHA</text>

    <line x1="645" y1="215" x2="645" y2="255" stroke="#0a4020" stroke-width="0.6" opacity="0.4"/>

    <text x="725" y="228" text-anchor="middle" font-size="11" letter-spacing="1">SPELLS ADDED</text>
    <text x="725" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#1a6e3a" filter="url(#glow-soft)">10</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#052010" font-style="italic">
    "They know the routes past the doors of death. You're about to learn them too."
  </text>
</svg>
