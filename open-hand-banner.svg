<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060809"/>
      <stop offset="50%" style="stop-color:#0a1015"/>
      <stop offset="100%" style="stop-color:#060809"/>
    </linearGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#101820"/>
      <stop offset="25%" style="stop-color:#506070"/>
      <stop offset="50%" style="stop-color:#a0c0d0"/>
      <stop offset="75%" style="stop-color:#506070"/>
      <stop offset="100%" style="stop-color:#101820"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#060809;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#506070;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#a0c0d0;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#506070;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#060809;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#506070" stroke-width="0.2" opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <circle cx="450" cy="128" r="88" fill="none" stroke="#506070" stroke-width="0.8" opacity="0.22"/>
  <circle cx="450" cy="128" r="65" fill="none" stroke="#506070" stroke-width="0.4" opacity="0.13"/>
  <g stroke="#506070" stroke-width="0.6" opacity="0.12">
    <line x1="450" y1="40" x2="450" y2="216"/>
    <line x1="362" y1="128" x2="538" y2="128"/>
    <line x1="388" y1="64" x2="512" y2="192"/>
    <line x1="512" y1="64" x2="388" y2="192"/>
  </g>
  <rect x="0" y="0" width="3" height="300" fill="url(#silver)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#silver)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <g stroke="#506070" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#506070" stroke="none"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#506070" stroke="none"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <circle cx="20" cy="280" r="3" fill="#506070" stroke="none"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <circle cx="880" cy="280" r="3" fill="#506070" stroke="none"/>
  </g>
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#101820" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>
  <rect x="305" y="66" width="290" height="24" rx="2" fill="#060809" opacity="0.9"/>
  <rect x="305" y="66" width="290" height="24" rx="2" fill="none" stroke="#506070" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#a0c0d0" letter-spacing="4">MONASTIC TRADITION</text>
  <text x="450" y="148" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="42" font-weight="bold" fill="url(#silver)" filter="url(#glow)" letter-spacing="4">WAY OF THE OPEN HAND</text>
  <text x="450" y="176" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#506070" letter-spacing="5" opacity="0.9">CONTROL · WHOLENESS · OPEN HAND TECHNIQUE</text>
  <rect x="100" y="195" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#101820">
    <text x="180" y="223" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#a0c0d0" filter="url(#glow-soft)">d8</text>
    <line x1="265" y1="210" x2="265" y2="252" stroke="#506070" stroke-width="0.6" opacity="0.4"/>
    <text x="345" y="223" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0c0d0">LEVEL 3</text>
    <line x1="420" y1="210" x2="420" y2="252" stroke="#506070" stroke-width="0.6" opacity="0.4"/>
    <text x="450" y="220" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#a0c0d0">DEX · WIS</text>
    <line x1="490" y1="210" x2="490" y2="252" stroke="#506070" stroke-width="0.6" opacity="0.4"/>
    <text x="570" y="223" text-anchor="middle" font-size="11" letter-spacing="1">KEY FEATURE</text>
    <text x="570" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#a0c0d0">OPEN HAND TECH.</text>
    <line x1="645" y1="210" x2="645" y2="252" stroke="#506070" stroke-width="0.6" opacity="0.4"/>
    <text x="725" y="223" text-anchor="middle" font-size="11" letter-spacing="1">FEATURES</text>
    <text x="725" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#a0c0d0" filter="url(#glow-soft)">3</text>
  </g>
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#101820" font-style="italic">
    "The open hand does not strike blindly. It chooses exactly what it takes."
  </text>
</svg>
