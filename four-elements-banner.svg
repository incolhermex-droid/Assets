<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0300"/>
      <stop offset="50%" style="stop-color:#180800"/>
      <stop offset="100%" style="stop-color:#0a0300"/>
    </linearGradient>
    <linearGradient id="lava" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#280800"/>
      <stop offset="25%" style="stop-color:#a03000"/>
      <stop offset="50%" style="stop-color:#f06000"/>
      <stop offset="75%" style="stop-color:#a03000"/>
      <stop offset="100%" style="stop-color:#280800"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0300;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#a03000;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#f06000;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#a03000;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#0a0300;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#a03000" stroke-width="0.25" opacity="0.15"/>
    </pattern>
  </defs>
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <!-- 4 element quadrants suggestion -->
  <circle cx="450" cy="128" r="85" fill="none" stroke="#a03000" stroke-width="0.8" opacity="0.22"/>
  <circle cx="450" cy="128" r="60" fill="none" stroke="#a03000" stroke-width="0.4" opacity="0.13"/>
  <g stroke="#a03000" stroke-width="0.6" opacity="0.15">
    <line x1="362" y1="128" x2="538" y2="128"/>
    <line x1="450" y1="43" x2="450" y2="213"/>
  </g>
  <!-- Element wisps -->
  <g fill="#f06000" opacity="0.18">
    <ellipse cx="200" cy="2" rx="2" ry="12"/>
    <ellipse cx="320" cy="2" rx="1.5" ry="9"/>
    <ellipse cx="580" cy="2" rx="2" ry="14"/>
    <ellipse cx="700" cy="2" rx="1.5" ry="10"/>
  </g>
  <rect x="0" y="0" width="3" height="300" fill="url(#lava)" opacity="0.9"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#lava)" opacity="0.9"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <g stroke="#a03000" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#a03000" stroke="none"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#a03000" stroke="none"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <circle cx="20" cy="280" r="3" fill="#a03000" stroke="none"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <circle cx="880" cy="280" r="3" fill="#a03000" stroke="none"/>
  </g>
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#280800" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>
  <rect x="305" y="66" width="290" height="24" rx="2" fill="#0a0300" opacity="0.9"/>
  <rect x="305" y="66" width="290" height="24" rx="2" fill="none" stroke="#a03000" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#f06000" letter-spacing="4">MONASTIC TRADITION</text>
  <text x="450" y="142" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="38" font-weight="bold" fill="url(#lava)" filter="url(#glow)" letter-spacing="3">WAY OF THE FOUR ELEMENTS</text>
  <text x="450" y="176" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#a03000" letter-spacing="5" opacity="0.9">ELEMENTAL ATTUNEMENT · AURA COMBAT · 5 ELEMENTS</text>
  <rect x="100" y="195" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#280800">
    <text x="180" y="223" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#f06000" filter="url(#glow-soft)">d8</text>
    <line x1="265" y1="210" x2="265" y2="252" stroke="#a03000" stroke-width="0.6" opacity="0.4"/>
    <text x="345" y="223" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#f06000">LEVEL 3</text>
    <line x1="420" y1="210" x2="420" y2="252" stroke="#a03000" stroke-width="0.6" opacity="0.4"/>
    <text x="450" y="220" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="435" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#f06000">DEX · WIS</text>
    <line x1="490" y1="210" x2="490" y2="252" stroke="#a03000" stroke-width="0.6" opacity="0.4"/>
    <text x="570" y="223" text-anchor="middle" font-size="11" letter-spacing="1">ELEMENTS</text>
    <text x="575" y="243" text-anchor="middle" font-size="10" font-weight="bold" fill="#f06000">ACID·FIRE·ICE·LIGHTNING·THUNDER</text>
    <line x1="645" y1="210" x2="645" y2="252" stroke="#a03000" stroke-width="0.6" opacity="0.4"/>
    <text x="725" y="223" text-anchor="middle" font-size="11" letter-spacing="1">FEATURES</text>
    <text x="725" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#f06000" filter="url(#glow-soft)">3</text>
  </g>
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#280800" font-style="italic">
    "Fire, water, earth, air — and the will to become all of them at once."
  </text>
</svg>
