<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06080a"/>
      <stop offset="50%" style="stop-color:#0a1018"/>
      <stop offset="100%" style="stop-color:#06080a"/>
    </linearGradient>
    <linearGradient id="celestial" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#101828"/>
      <stop offset="25%" style="stop-color:#4878a8"/>
      <stop offset="50%" style="stop-color:#88c8f8"/>
      <stop offset="75%" style="stop-color:#4878a8"/>
      <stop offset="100%" style="stop-color:#101828"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06080a;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#4878a8;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#88c8f8;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#4878a8;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#06080a;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="divglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#88c8f8;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#06080a;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-celestial">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stars" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="0.5" fill="#88c8f8" opacity="0.3"/>
      <circle cx="18" cy="22" r="0.4" fill="#88c8f8" opacity="0.2"/>
      <circle cx="25" cy="5" r="0.6" fill="#4878a8" opacity="0.25"/>
      <circle cx="10" cy="28" r="0.3" fill="#88c8f8" opacity="0.15"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#4878a8" stroke-width="0.2" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#stars)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#divglow)"/>

  <!-- Borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#celestial)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#celestial)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Celestial halo -->
  <circle cx="450" cy="128" r="90" fill="none" stroke="#4878a8" stroke-width="0.8" opacity="0.22"/>
  <circle cx="450" cy="128" r="70" fill="none" stroke="#4878a8" stroke-width="0.5" opacity="0.15"/>
  <circle cx="450" cy="128" r="45" fill="none" stroke="#4878a8" stroke-width="0.3" opacity="0.1"/>
  <!-- Star rays -->
  <g stroke="#4878a8" stroke-width="0.6" opacity="0.12">
    <line x1="450" y1="38" x2="450" y2="218"/>
    <line x1="362" y1="128" x2="538" y2="128"/>
    <line x1="387" y1="65" x2="513" y2="191"/>
    <line x1="513" y1="65" x2="387" y2="191"/>
    <line x1="369" y1="95" x2="531" y2="161"/>
    <line x1="531" y1="95" x2="369" y2="161"/>
  </g>

  <!-- Corner ornaments -->
  <g stroke="#4878a8" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#4878a8" stroke="none" opacity="0.8"/>
    <circle cx="36" cy="20" r="1.5" fill="#4878a8" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#4878a8" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#4878a8" stroke="none" opacity="0.8"/>
    <circle cx="864" cy="20" r="1.5" fill="#4878a8" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#4878a8" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#4878a8" stroke="none" opacity="0.8"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#4878a8" stroke="none" opacity="0.8"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#101828" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- WARLOCK SUBCLASS badge -->
  <rect x="320" y="66" width="260" height="24" rx="2" fill="#06080a" opacity="0.9"/>
  <rect x="320" y="66" width="260" height="24" rx="2" fill="none" stroke="#4878a8" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#88c8f8" letter-spacing="4">WARLOCK SUBCLASS</text>

  <!-- Main title -->
  <text x="450" y="148" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="52" font-weight="bold" fill="url(#celestial)" filter="url(#glow-celestial)" letter-spacing="5">CELESTIAL PATRON</text>

  <!-- Subtitle -->
  <text x="450" y="176" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#4878a8" letter-spacing="5" opacity="0.9">HEALING LIGHT · RADIANT SOUL · CELESTIAL RESILIENCE</text>

  <!-- Bottom separator -->
  <rect x="100" y="195" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#101828">
    <text x="180" y="223" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#88c8f8" filter="url(#glow-soft)">d8</text>
    <line x1="265" y1="210" x2="265" y2="252" stroke="#4878a8" stroke-width="0.6" opacity="0.4"/>
    <text x="345" y="223" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#88c8f8">LEVEL 1</text>
    <line x1="420" y1="210" x2="420" y2="252" stroke="#4878a8" stroke-width="0.6" opacity="0.4"/>
    <text x="450" y="220" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#88c8f8">CHA</text>
    <line x1="490" y1="210" x2="490" y2="252" stroke="#4878a8" stroke-width="0.6" opacity="0.4"/>
    <text x="570" y="223" text-anchor="middle" font-size="11" letter-spacing="1">RESOURCE</text>
    <text x="570" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#88c8f8">HEALING LIGHT</text>
    <line x1="645" y1="210" x2="645" y2="252" stroke="#4878a8" stroke-width="0.6" opacity="0.4"/>
    <text x="725" y="223" text-anchor="middle" font-size="11" letter-spacing="1">SPELLS ADDED</text>
    <text x="725" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#88c8f8" filter="url(#glow-soft)">7</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#101828" font-style="italic">
    "Your patron shines. You are what it shines through."
  </text>
</svg>
