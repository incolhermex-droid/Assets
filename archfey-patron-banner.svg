<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020a05"/>
      <stop offset="50%" style="stop-color:#04150a"/>
      <stop offset="100%" style="stop-color:#020a05"/>
    </linearGradient>
    <linearGradient id="fey" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#002018"/>
      <stop offset="25%" style="stop-color:#008858"/>
      <stop offset="50%" style="stop-color:#20e890"/>
      <stop offset="75%" style="stop-color:#008858"/>
      <stop offset="100%" style="stop-color:#002018"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020a05;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#008858;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#20e890;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#008858;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#020a05;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="feyglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#20e890;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#020a05;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-fey">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#008858" stroke-width="0.2" opacity="0.13"/>
    </pattern>
    <pattern id="sparkles" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="8" cy="12" r="0.8" fill="#20e890" opacity="0.2"/>
      <circle cx="28" cy="30" r="0.5" fill="#20e890" opacity="0.15"/>
      <circle cx="35" cy="8" r="0.6" fill="#008858" opacity="0.2"/>
      <circle cx="15" cy="35" r="0.4" fill="#20e890" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#sparkles)"/>
  <rect width="900" height="300" fill="url(#feyglow)"/>

  <!-- Borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#fey)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#fey)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Fey circle / Misty Step portal -->
  <circle cx="450" cy="128" r="88" fill="none" stroke="#008858" stroke-width="0.8" opacity="0.22"/>
  <circle cx="450" cy="128" r="68" fill="none" stroke="#008858" stroke-width="0.5" opacity="0.15"/>
  <circle cx="450" cy="128" r="42" fill="none" stroke="#008858" stroke-width="0.3" opacity="0.1"/>
  <!-- Fey leaf/star pattern -->
  <g stroke="#008858" stroke-width="0.6" opacity="0.13" stroke-linecap="round">
    <line x1="450" y1="40" x2="450" y2="216"/>
    <line x1="362" y1="128" x2="538" y2="128"/>
    <line x1="388" y1="65" x2="512" y2="191"/>
    <line x1="512" y1="65" x2="388" y2="191"/>
    <line x1="372" y1="95" x2="528" y2="161"/>
    <line x1="528" y1="95" x2="372" y2="161"/>
  </g>

  <!-- Corner ornaments -->
  <g stroke="#008858" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#008858" stroke="none" opacity="0.8"/>
    <circle cx="36" cy="20" r="1.5" fill="#008858" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#008858" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#008858" stroke="none" opacity="0.8"/>
    <circle cx="864" cy="20" r="1.5" fill="#008858" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#008858" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#008858" stroke="none" opacity="0.8"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#008858" stroke="none" opacity="0.8"/>
  </g>

  <!-- Fey wisps top -->
  <g fill="#20e890" opacity="0.18">
    <ellipse cx="180" cy="2" rx="1.5" ry="11"/>
    <ellipse cx="310" cy="2" rx="2" ry="8"/>
    <ellipse cx="590" cy="2" rx="1.5" ry="13"/>
    <ellipse cx="720" cy="2" rx="2" ry="9"/>
    <ellipse cx="140" cy="2" rx="1" ry="6"/>
    <ellipse cx="760" cy="2" rx="1" ry="7"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#002018" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- WARLOCK SUBCLASS badge -->
  <rect x="320" y="66" width="260" height="24" rx="2" fill="#020a05" opacity="0.9"/>
  <rect x="320" y="66" width="260" height="24" rx="2" fill="none" stroke="#008858" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#20e890" letter-spacing="4">WARLOCK SUBCLASS</text>

  <!-- Main title -->
  <text x="450" y="148" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="54" font-weight="bold" fill="url(#fey)" filter="url(#glow-fey)" letter-spacing="5">ARCHFEY PATRON</text>

  <!-- Subtitle -->
  <text x="450" y="176" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#008858" letter-spacing="5" opacity="0.9">STEPS OF THE FEY · MISTY ESCAPE · BEGUILING DEFENSES</text>

  <!-- Bottom separator -->
  <rect x="100" y="195" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#002018">
    <text x="180" y="223" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#20e890" filter="url(#glow-soft)">d8</text>
    <line x1="265" y1="210" x2="265" y2="252" stroke="#008858" stroke-width="0.6" opacity="0.4"/>
    <text x="345" y="223" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#20e890">LEVEL 1</text>
    <line x1="420" y1="210" x2="420" y2="252" stroke="#008858" stroke-width="0.6" opacity="0.4"/>
    <text x="450" y="220" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#20e890">CHA</text>
    <line x1="490" y1="210" x2="490" y2="252" stroke="#008858" stroke-width="0.6" opacity="0.4"/>
    <text x="570" y="223" text-anchor="middle" font-size="11" letter-spacing="1">KEY FEATURE</text>
    <text x="570" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#20e890">STEPS OF THE FEY</text>
    <line x1="645" y1="210" x2="645" y2="252" stroke="#008858" stroke-width="0.6" opacity="0.4"/>
    <text x="725" y="223" text-anchor="middle" font-size="11" letter-spacing="1">FEATURES</text>
    <text x="725" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#20e890" filter="url(#glow-soft)">3</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#002018" font-style="italic">
    "The fey don't lie. They just make the truth look like something else entirely."
  </text>
</svg>
