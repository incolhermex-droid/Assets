<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080508"/>
      <stop offset="50%" style="stop-color:#120008"/>
      <stop offset="100%" style="stop-color:#080508"/>
    </linearGradient>
    <linearGradient id="crimson" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a0008"/>
      <stop offset="25%" style="stop-color:#8b0000"/>
      <stop offset="50%" style="stop-color:#cc1a1a"/>
      <stop offset="75%" style="stop-color:#8b0000"/>
      <stop offset="100%" style="stop-color:#2a0008"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#080508;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#8b0000;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#cc1a1a;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#8b0000;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#080508;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="hellglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#cc1a1a;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#080508;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-red">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#8b0000" stroke-width="0.2" opacity="0.12"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#8b0000" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#dots)"/>
  <!-- Hell glow from top -->
  <rect width="900" height="300" fill="url(#hellglow)"/>

  <!-- Side borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#crimson)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#crimson)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Infernal seal - background circle -->
  <circle cx="450" cy="130" r="95" fill="none" stroke="#8b0000" stroke-width="0.6" opacity="0.3"/>
  <circle cx="450" cy="130" r="85" fill="none" stroke="#8b0000" stroke-width="0.4" opacity="0.2"/>
  <!-- Pentagram lines - subtle background -->
  <g stroke="#8b0000" stroke-width="0.5" opacity="0.12">
    <line x1="450" y1="45" x2="370" y2="205"/>
    <line x1="450" y1="45" x2="530" y2="205"/>
    <line x1="370" y1="205" x2="535" y2="100"/>
    <line x1="530" y1="205" x2="365" y2="100"/>
    <line x1="535" y1="100" x2="365" y2="100"/>
  </g>

  <!-- Corner ornaments - gothic style -->
  <g stroke="#8b0000" stroke-width="1" fill="none" opacity="0.6">
    <!-- Top left -->
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <path d="M36,20 L36,28 M20,36 L28,36"/>
    <circle cx="20" cy="20" r="3" fill="#8b0000" stroke="none" opacity="0.8"/>
    <circle cx="36" cy="20" r="1.5" fill="#8b0000" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#8b0000" stroke="none" opacity="0.5"/>
    <!-- Top right -->
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <path d="M864,20 L864,28 M880,36 L872,36"/>
    <circle cx="880" cy="20" r="3" fill="#8b0000" stroke="none" opacity="0.8"/>
    <circle cx="864" cy="20" r="1.5" fill="#8b0000" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#8b0000" stroke="none" opacity="0.5"/>
    <!-- Bottom left -->
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#8b0000" stroke="none" opacity="0.8"/>
    <!-- Bottom right -->
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#8b0000" stroke="none" opacity="0.8"/>
  </g>

  <!-- Blood drip decorations - top -->
  <g fill="#8b0000" opacity="0.25">
    <ellipse cx="200" cy="2" rx="2" ry="8"/>
    <ellipse cx="320" cy="2" rx="1.5" ry="12"/>
    <ellipse cx="580" cy="2" rx="1.5" ry="10"/>
    <ellipse cx="700" cy="2" rx="2" ry="7"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#4a0010" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- NEW CLASS badge -->
  <rect x="360" y="66" width="180" height="24" rx="2" fill="#2a0008" opacity="0.8"/>
  <rect x="360" y="66" width="180" height="24" rx="2" fill="none" stroke="#8b0000" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#cc1a1a" letter-spacing="4">NEW CLASS</text>

  <!-- Main title -->
  <text x="450" y="158" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="72" font-weight="bold" fill="url(#crimson)" filter="url(#glow-red)" letter-spacing="8">ILLRIGGER</text>

  <!-- Subtitle -->
  <text x="450" y="183" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#8b0000" letter-spacing="5" opacity="0.9">INFERNAL ENFORCER · DIVINE EXECUTIONER · HELL'S BLADE</text>

  <!-- Bottom separator -->
  <rect x="100" y="200" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#4a0010">
    <!-- Hit Die -->
    <text x="180" y="228" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#cc1a1a" filter="url(#glow-soft)">d10</text>

    <line x1="265" y1="215" x2="265" y2="255" stroke="#8b0000" stroke-width="0.6" opacity="0.4"/>

    <!-- Armor -->
    <text x="345" y="228" text-anchor="middle" font-size="11" letter-spacing="1">ARMOR</text>
    <text x="345" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#cc1a1a">ALL TYPES</text>

    <line x1="420" y1="215" x2="420" y2="255" stroke="#8b0000" stroke-width="0.6" opacity="0.4"/>

    <!-- Saves -->
    <text x="450" y="225" text-anchor="middle" font-size="11" letter-spacing="1">SAVES</text>
    <text x="450" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#cc1a1a">WIS · CHA</text>

    <line x1="490" y1="215" x2="490" y2="255" stroke="#8b0000" stroke-width="0.6" opacity="0.4"/>

    <!-- Primary -->
    <text x="570" y="228" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="570" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#cc1a1a">STR / CHA</text>

    <line x1="645" y1="215" x2="645" y2="255" stroke="#8b0000" stroke-width="0.6" opacity="0.4"/>

    <!-- Subclasses -->
    <text x="725" y="228" text-anchor="middle" font-size="11" letter-spacing="1">SUBCLASSES</text>
    <text x="725" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#cc1a1a" filter="url(#glow-soft)">4</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#3a0010" font-style="italic">
    "The Paladin chose Heaven. You chose power. Hell keeps its promises."
  </text>
</svg>
