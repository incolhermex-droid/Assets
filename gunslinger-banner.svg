<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0805"/>
      <stop offset="40%" style="stop-color:#160e06"/>
      <stop offset="100%" style="stop-color:#0a0805"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3d1a00"/>
      <stop offset="25%" style="stop-color:#b5651d"/>
      <stop offset="50%" style="stop-color:#e8923a"/>
      <stop offset="75%" style="stop-color:#b5651d"/>
      <stop offset="100%" style="stop-color:#3d1a00"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0805;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#b5651d;stop-opacity:0.6"/>
      <stop offset="50%" style="stop-color:#e8923a;stop-opacity:0.9"/>
      <stop offset="85%" style="stop-color:#b5651d;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0a0805;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="smoke" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#1a0f00;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#2a1800;stop-opacity:0.4"/>
    </linearGradient>
    <filter id="glow-copper">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Crosshatch texture -->
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#b5651d" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Base background -->
  <rect width="900" height="280" fill="url(#bg)"/>
  <!-- Texture overlay -->
  <rect width="900" height="280" fill="url(#hatch)"/>
  <!-- Smoke/atmosphere -->
  <rect width="900" height="280" fill="url(#smoke)"/>

  <!-- Decorative side panels -->
  <rect x="0" y="0" width="3" height="280" fill="url(#copper)" opacity="0.7"/>
  <rect x="897" y="0" width="3" height="280" fill="url(#copper)" opacity="0.7"/>

  <!-- Top border -->
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.8"/>
  <!-- Bottom border -->
  <rect x="0" y="278" width="900" height="2" fill="url(#fade)" opacity="0.8"/>

  <!-- Corner ornaments - top left -->
  <g stroke="#b5651d" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M25,25 L70,25"/>
    <path d="M25,25 L25,70"/>
    <path d="M30,30 L60,30"/>
    <path d="M30,30 L30,60"/>
    <circle cx="25" cy="25" r="3" fill="#b5651d" stroke="none"/>
  </g>
  <!-- Corner ornaments - top right -->
  <g stroke="#b5651d" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M875,25 L830,25"/>
    <path d="M875,25 L875,70"/>
    <path d="M870,30 L840,30"/>
    <path d="M870,30 L870,60"/>
    <circle cx="875" cy="25" r="3" fill="#b5651d" stroke="none"/>
  </g>
  <!-- Corner ornaments - bottom left -->
  <g stroke="#b5651d" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M25,255 L70,255"/>
    <path d="M25,255 L25,210"/>
    <path d="M30,250 L60,250"/>
    <path d="M30,250 L30,220"/>
    <circle cx="25" cy="255" r="3" fill="#b5651d" stroke="none"/>
  </g>
  <!-- Corner ornaments - bottom right -->
  <g stroke="#b5651d" stroke-width="1.2" fill="none" opacity="0.7">
    <path d="M875,255 L830,255"/>
    <path d="M875,255 L875,210"/>
    <path d="M870,250 L840,250"/>
    <path d="M870,250 L870,220"/>
    <circle cx="875" cy="255" r="3" fill="#b5651d" stroke="none"/>
  </g>

  <!-- Decorative bullet holes - left -->
  <g opacity="0.25">
    <circle cx="120" cy="80" r="4" fill="none" stroke="#b5651d" stroke-width="1"/>
    <circle cx="120" cy="80" r="1.5" fill="#b5651d"/>
    <line x1="116" y1="76" x2="112" y2="72" stroke="#b5651d" stroke-width="0.8"/>
    <line x1="124" y1="76" x2="128" y2="72" stroke="#b5651d" stroke-width="0.8"/>
    <line x1="116" y1="84" x2="112" y2="88" stroke="#b5651d" stroke-width="0.8"/>
    <line x1="124" y1="84" x2="128" y2="88" stroke="#b5651d" stroke-width="0.8"/>
  </g>
  <!-- Decorative bullet holes - right -->
  <g opacity="0.25">
    <circle cx="780" cy="200" r="4" fill="none" stroke="#b5651d" stroke-width="1"/>
    <circle cx="780" cy="200" r="1.5" fill="#b5651d"/>
    <line x1="776" y1="196" x2="772" y2="192" stroke="#b5651d" stroke-width="0.8"/>
    <line x1="784" y1="196" x2="788" y2="192" stroke="#b5651d" stroke-width="0.8"/>
    <line x1="776" y1="204" x2="772" y2="208" stroke="#b5651d" stroke-width="0.8"/>
    <line x1="784" y1="204" x2="788" y2="208" stroke="#b5651d" stroke-width="0.8"/>
  </g>

  <!-- Gunslinger silhouette - abstract pistol shape left -->
  <g opacity="0.06" fill="#e8923a">
    <path d="M80,160 L160,160 L160,145 L175,145 L175,130 L165,130 L165,120 L155,120 L155,130 L160,130 L160,140 L80,140 Z"/>
    <rect x="85" y="160" width="15" height="35" rx="2"/>
  </g>
  <!-- Gunslinger silhouette - right -->
  <g opacity="0.06" fill="#e8923a" transform="translate(900,0) scale(-1,1)">
    <path d="M80,160 L160,160 L160,145 L175,145 L175,130 L165,130 L165,120 L155,120 L155,130 L160,130 L160,140 L80,140 Z"/>
    <rect x="85" y="160" width="15" height="35" rx="2"/>
  </g>

  <!-- Top separator line -->
  <rect x="100" y="55" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Class badge top -->
  <text x="450" y="46" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#7a4010" letter-spacing="8" text-transform="uppercase">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- NEW CLASS badge -->
  <rect x="370" y="64" width="160" height="22" rx="2" fill="#7a2000" opacity="0.6"/>
  <rect x="370" y="64" width="160" height="22" rx="2" fill="none" stroke="#b5651d" stroke-width="0.8" opacity="0.8"/>
  <text x="450" y="79" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#e8923a" letter-spacing="4">NEW CLASS</text>

  <!-- Main title -->
  <text x="450" y="148" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="68" font-weight="bold" fill="url(#copper)" filter="url(#glow-copper)" letter-spacing="6">GUNSLINGER</text>

  <!-- Subtitle line -->
  <text x="450" y="175" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="14" fill="#b5651d" letter-spacing="5" opacity="0.9">MASTER OF FIREARMS · ARCANE SHARPSHOOTER</text>

  <!-- Bottom separator -->
  <rect x="100" y="192" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#7a4010">
    <!-- Hit Die -->
    <text x="230" y="220" text-anchor="middle">HIT DIE</text>
    <text x="230" y="238" text-anchor="middle" font-size="18" font-weight="bold" fill="#e8923a" filter="url(#glow-soft)">d10</text>

    <!-- Divider -->
    <line x1="310" y1="210" x2="310" y2="245" stroke="#7a4010" stroke-width="0.8" opacity="0.5"/>

    <!-- Primary -->
    <text x="390" y="220" text-anchor="middle">PRIMARY</text>
    <text x="390" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8923a">DEX / WIS</text>

    <!-- Divider -->
    <line x1="470" y1="210" x2="470" y2="245" stroke="#7a4010" stroke-width="0.8" opacity="0.5"/>

    <!-- Saves -->
    <text x="550" y="220" text-anchor="middle">SAVES</text>
    <text x="550" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8923a">DEX · INT</text>

    <!-- Divider -->
    <line x1="630" y1="210" x2="630" y2="245" stroke="#7a4010" stroke-width="0.8" opacity="0.5"/>

    <!-- Subclasses -->
    <text x="710" y="220" text-anchor="middle">SUBCLASSES</text>
    <text x="710" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#e8923a">3</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="265" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#4a2800" font-style="italic">
    "In the Forgotten Realms, magic rules — until the hammer falls."
  </text>
</svg>
