<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080500"/>
      <stop offset="50%" style="stop-color:#120a00"/>
      <stop offset="100%" style="stop-color:#080500"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#201000"/>
      <stop offset="25%" style="stop-color:#804800"/>
      <stop offset="50%" style="stop-color:#d07800"/>
      <stop offset="75%" style="stop-color:#804800"/>
      <stop offset="100%" style="stop-color:#201000"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#080500;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#804800;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#d07800;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#804800;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#080500;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="kiglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#d07800;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#080500;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-amber">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#804800" stroke-width="0.2" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#kiglow)"/>

  <!-- Borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#amber)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#amber)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Ki energy rings -->
  <circle cx="450" cy="128" r="88" fill="none" stroke="#804800" stroke-width="0.8" opacity="0.22"/>
  <circle cx="450" cy="128" r="68" fill="none" stroke="#804800" stroke-width="0.5" opacity="0.15"/>
  <circle cx="450" cy="128" r="40" fill="none" stroke="#804800" stroke-width="0.3" opacity="0.1"/>
  <!-- Martial arts stance lines -->
  <g stroke="#804800" stroke-width="0.7" opacity="0.15" stroke-linecap="round">
    <line x1="395" y1="73" x2="505" y2="183"/>
    <line x1="505" y1="73" x2="395" y2="183"/>
    <line x1="362" y1="128" x2="538" y2="128"/>
    <line x1="450" y1="40" x2="450" y2="216"/>
  </g>

  <!-- Corner ornaments -->
  <g stroke="#804800" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#804800" stroke="none" opacity="0.8"/>
    <circle cx="36" cy="20" r="1.5" fill="#804800" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#804800" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#804800" stroke="none" opacity="0.8"/>
    <circle cx="864" cy="20" r="1.5" fill="#804800" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#804800" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#804800" stroke="none" opacity="0.8"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#804800" stroke="none" opacity="0.8"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#201000" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- BASE CLASS badge -->
  <rect x="355" y="66" width="190" height="24" rx="2" fill="#080500" opacity="0.9"/>
  <rect x="355" y="66" width="190" height="24" rx="2" fill="none" stroke="#804800" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#d07800" letter-spacing="5">BASE CLASS</text>

  <!-- Main title -->
  <text x="450" y="157" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="78" font-weight="bold" fill="url(#amber)" filter="url(#glow-amber)" letter-spacing="8">MONK</text>

  <!-- Subtitle -->
  <text x="450" y="182" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#804800" letter-spacing="5" opacity="0.9">KI · MARTIAL ARTS · UNARMORED DISCIPLINE</text>

  <!-- Bottom separator -->
  <rect x="100" y="200" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#201000">
    <text x="180" y="228" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#d07800" filter="url(#glow-soft)">d8</text>

    <line x1="265" y1="215" x2="265" y2="255" stroke="#804800" stroke-width="0.6" opacity="0.4"/>

    <text x="345" y="228" text-anchor="middle" font-size="11" letter-spacing="1">SUBCLASS AT</text>
    <text x="345" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#d07800">LEVEL 3</text>

    <line x1="420" y1="215" x2="420" y2="255" stroke="#804800" stroke-width="0.6" opacity="0.4"/>

    <text x="450" y="225" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="450" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#d07800">DEX · WIS</text>

    <line x1="490" y1="215" x2="490" y2="255" stroke="#804800" stroke-width="0.6" opacity="0.4"/>

    <text x="570" y="228" text-anchor="middle" font-size="11" letter-spacing="1">ARMOR</text>
    <text x="570" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#d07800">NONE</text>

    <line x1="645" y1="215" x2="645" y2="255" stroke="#804800" stroke-width="0.6" opacity="0.4"/>

    <text x="725" y="228" text-anchor="middle" font-size="11" letter-spacing="1">SUBCLASSES</text>
    <text x="725" y="248" text-anchor="middle" font-size="20" font-weight="bold" fill="#d07800" filter="url(#glow-soft)">4</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#201000" font-style="italic">
    "No armor. No magic. Just discipline — and the conviction that it's enough."
  </text>
</svg>
