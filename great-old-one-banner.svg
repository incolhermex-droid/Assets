<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020805"/>
      <stop offset="50%" style="stop-color:#040f08"/>
      <stop offset="100%" style="stop-color:#020805"/>
    </linearGradient>
    <linearGradient id="eldritch" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#001808"/>
      <stop offset="25%" style="stop-color:#207840"/>
      <stop offset="50%" style="stop-color:#50e870"/>
      <stop offset="75%" style="stop-color:#207840"/>
      <stop offset="100%" style="stop-color:#001808"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#020805;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#207840;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#50e870;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#207840;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#020805;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="voidglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#50e870;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#020805;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-eldritch">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#207840" stroke-width="0.2" opacity="0.13"/>
    </pattern>
    <pattern id="void-dots" width="25" height="25" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="8" r="0.5" fill="#50e870" opacity="0.15"/>
      <circle cx="18" cy="20" r="0.4" fill="#207840" opacity="0.2"/>
      <circle cx="22" cy="5" r="0.6" fill="#50e870" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#void-dots)"/>
  <rect width="900" height="300" fill="url(#voidglow)"/>

  <!-- Borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#eldritch)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#eldritch)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Elder eye symbol - irregular, unsettling -->
  <ellipse cx="450" cy="128" rx="92" ry="50" fill="none" stroke="#207840" stroke-width="0.8" opacity="0.22"/>
  <ellipse cx="450" cy="128" rx="70" ry="35" fill="none" stroke="#207840" stroke-width="0.5" opacity="0.14"/>
  <circle cx="450" cy="128" r="18" fill="none" stroke="#50e870" stroke-width="0.6" opacity="0.25"/>
  <!-- Tentacle-like irregular lines -->
  <g stroke="#207840" stroke-width="0.5" opacity="0.12" stroke-linecap="round">
    <path d="M362,128 Q400,105 420,128 Q440,150 450,128"/>
    <path d="M538,128 Q500,105 480,128 Q460,150 450,128"/>
    <path d="M450,43 Q428,80 450,108 Q472,80 450,43"/>
    <path d="M450,213 Q428,176 450,148 Q472,176 450,213"/>
  </g>

  <!-- Corner ornaments -->
  <g stroke="#207840" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#207840" stroke="none" opacity="0.9"/>
    <circle cx="36" cy="20" r="1.5" fill="#207840" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#207840" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#207840" stroke="none" opacity="0.9"/>
    <circle cx="864" cy="20" r="1.5" fill="#207840" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#207840" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#207840" stroke="none" opacity="0.9"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#207840" stroke="none" opacity="0.9"/>
  </g>

  <!-- Void wisps -->
  <g fill="#50e870" opacity="0.14">
    <ellipse cx="190" cy="2" rx="1.5" ry="13"/>
    <ellipse cx="310" cy="2" rx="2" ry="9"/>
    <ellipse cx="590" cy="2" rx="1.5" ry="11"/>
    <ellipse cx="710" cy="2" rx="2" ry="8"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#001808" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- WARLOCK SUBCLASS badge -->
  <rect x="320" y="66" width="260" height="24" rx="2" fill="#020805" opacity="0.9"/>
  <rect x="320" y="66" width="260" height="24" rx="2" fill="none" stroke="#207840" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#50e870" letter-spacing="4">WARLOCK SUBCLASS</text>

  <!-- Main title -->
  <text x="450" y="142" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="46" font-weight="bold" fill="url(#eldritch)" filter="url(#glow-eldritch)" letter-spacing="4">GREAT OLD ONE PATRON</text>

  <!-- Subtitle -->
  <text x="450" y="170" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#207840" letter-spacing="5" opacity="0.9">ELDRITCH HEX · ENTROPIC WARD · THOUGHT SHIELD</text>

  <!-- Bottom separator -->
  <rect x="100" y="190" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#001808">
    <text x="180" y="218" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#50e870" filter="url(#glow-soft)">d8</text>
    <line x1="265" y1="205" x2="265" y2="248" stroke="#207840" stroke-width="0.6" opacity="0.4"/>
    <text x="345" y="218" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="238" text-anchor="middle" font-size="13" font-weight="bold" fill="#50e870">LEVEL 1</text>
    <line x1="420" y1="205" x2="420" y2="248" stroke="#207840" stroke-width="0.6" opacity="0.4"/>
    <text x="450" y="215" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="450" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#50e870">CHA</text>
    <line x1="490" y1="205" x2="490" y2="248" stroke="#207840" stroke-width="0.6" opacity="0.4"/>
    <text x="570" y="218" text-anchor="middle" font-size="11" letter-spacing="1">KEY FEATURE</text>
    <text x="570" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#50e870">ELDRITCH HEX</text>
    <line x1="645" y1="205" x2="645" y2="248" stroke="#207840" stroke-width="0.6" opacity="0.4"/>
    <text x="725" y="218" text-anchor="middle" font-size="11" letter-spacing="1">FEATURES</text>
    <text x="725" y="238" text-anchor="middle" font-size="20" font-weight="bold" fill="#50e870" filter="url(#glow-soft)">4</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="278" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#001808" font-style="italic">
    "It noticed you first. That's the part they never mention."
  </text>
</svg>
