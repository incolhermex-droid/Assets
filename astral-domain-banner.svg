<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#000810"/>
      <stop offset="50%" style="stop-color:#001018"/>
      <stop offset="100%" style="stop-color:#000810"/>
    </linearGradient>
    <linearGradient id="astral" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#001525"/>
      <stop offset="25%" style="stop-color:#006888"/>
      <stop offset="50%" style="stop-color:#00c8d8"/>
      <stop offset="75%" style="stop-color:#006888"/>
      <stop offset="100%" style="stop-color:#001525"/>
    </linearGradient>
    <linearGradient id="fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#000810;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#006888;stop-opacity:0.8"/>
      <stop offset="50%" style="stop-color:#00c8d8;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#006888;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#000810;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="voidglow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" style="stop-color:#00c8d8;stop-opacity:0.12"/>
      <stop offset="100%" style="stop-color:#000810;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow-astral">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="stars" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="0.6" fill="#00c8d8" opacity="0.3"/>
      <circle cx="20" cy="15" r="0.4" fill="#00c8d8" opacity="0.2"/>
      <circle cx="12" cy="25" r="0.5" fill="#006888" opacity="0.25"/>
      <circle cx="25" cy="4" r="0.3" fill="#00c8d8" opacity="0.15"/>
    </pattern>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M0,10 L10,0" stroke="#006888" stroke-width="0.2" opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Base -->
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#stars)"/>
  <rect width="900" height="300" fill="url(#hatch)"/>
  <rect width="900" height="300" fill="url(#voidglow)"/>

  <!-- Borders -->
  <rect x="0" y="0" width="3" height="300" fill="url(#astral)" opacity="0.8"/>
  <rect x="897" y="0" width="3" height="300" fill="url(#astral)" opacity="0.8"/>
  <rect x="0" y="0" width="900" height="2" fill="url(#fade)" opacity="0.9"/>
  <rect x="0" y="298" width="900" height="2" fill="url(#fade)" opacity="0.9"/>

  <!-- Astral void rings -->
  <circle cx="450" cy="128" r="90" fill="none" stroke="#006888" stroke-width="0.8" opacity="0.25"/>
  <circle cx="450" cy="128" r="70" fill="none" stroke="#006888" stroke-width="0.5" opacity="0.18"/>
  <circle cx="450" cy="128" r="45" fill="none" stroke="#006888" stroke-width="0.3" opacity="0.12"/>
  <!-- Planar grid lines -->
  <g stroke="#006888" stroke-width="0.5" opacity="0.1" stroke-dasharray="3,8">
    <line x1="362" y1="128" x2="538" y2="128"/>
    <line x1="450" y1="40" x2="450" y2="216"/>
    <line x1="386" y1="64" x2="514" y2="192"/>
    <line x1="514" y1="64" x2="386" y2="192"/>
  </g>

  <!-- Corner ornaments -->
  <g stroke="#006888" stroke-width="1" fill="none" opacity="0.6">
    <path d="M20,20 L75,20 M20,20 L20,75"/>
    <path d="M28,28 L65,28 M28,28 L28,65"/>
    <circle cx="20" cy="20" r="3" fill="#006888" stroke="none" opacity="0.8"/>
    <circle cx="36" cy="20" r="1.5" fill="#006888" stroke="none" opacity="0.5"/>
    <circle cx="20" cy="36" r="1.5" fill="#006888" stroke="none" opacity="0.5"/>
    <path d="M880,20 L825,20 M880,20 L880,75"/>
    <path d="M872,28 L835,28 M872,28 L872,65"/>
    <circle cx="880" cy="20" r="3" fill="#006888" stroke="none" opacity="0.8"/>
    <circle cx="864" cy="20" r="1.5" fill="#006888" stroke="none" opacity="0.5"/>
    <circle cx="880" cy="36" r="1.5" fill="#006888" stroke="none" opacity="0.5"/>
    <path d="M20,280 L75,280 M20,280 L20,225"/>
    <path d="M28,272 L65,272 M28,272 L28,235"/>
    <circle cx="20" cy="280" r="3" fill="#006888" stroke="none" opacity="0.8"/>
    <path d="M880,280 L825,280 M880,280 L880,225"/>
    <path d="M872,272 L835,272 M872,272 L872,235"/>
    <circle cx="880" cy="280" r="3" fill="#006888" stroke="none" opacity="0.8"/>
  </g>

  <!-- Astral wisps -->
  <g fill="#00c8d8" opacity="0.15">
    <ellipse cx="180" cy="2" rx="1.5" ry="11"/>
    <ellipse cx="320" cy="2" rx="2" ry="8"/>
    <ellipse cx="580" cy="2" rx="1.5" ry="13"/>
    <ellipse cx="720" cy="2" rx="2" ry="9"/>
  </g>

  <!-- Top separator -->
  <rect x="100" y="58" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Source badge -->
  <text x="450" y="48" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="10" fill="#001525" letter-spacing="8">✦ DnD 5.5e ALL-IN-ONE BEYOND ✦</text>

  <!-- CLERIC DOMAIN badge -->
  <rect x="320" y="66" width="260" height="24" rx="2" fill="#000810" opacity="0.9"/>
  <rect x="320" y="66" width="260" height="24" rx="2" fill="none" stroke="#006888" stroke-width="0.8"/>
  <text x="450" y="83" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="11" fill="#00c8d8" letter-spacing="4">CLERIC DOMAIN</text>

  <!-- Main title -->
  <text x="450" y="148" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="55" font-weight="bold" fill="url(#astral)" filter="url(#glow-astral)" letter-spacing="6">ASTRAL DOMAIN</text>

  <!-- Subtitle -->
  <text x="450" y="176" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="13" fill="#006888" letter-spacing="5" opacity="0.9">CREATE VOID · PLANAR REACH · SPATIAL EXCHANGE</text>

  <!-- Bottom separator -->
  <rect x="100" y="195" width="700" height="0.8" fill="url(#fade)" opacity="0.5"/>

  <!-- Stats row -->
  <g font-family="'Palatino Linotype', Palatino, Georgia, serif" fill="#001525">
    <text x="180" y="223" text-anchor="middle" font-size="11" letter-spacing="1">HIT DIE</text>
    <text x="180" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#00c8d8" filter="url(#glow-soft)">d8</text>

    <line x1="265" y1="210" x2="265" y2="252" stroke="#006888" stroke-width="0.6" opacity="0.4"/>

    <text x="345" y="223" text-anchor="middle" font-size="11" letter-spacing="1">UNLOCKS</text>
    <text x="345" y="243" text-anchor="middle" font-size="13" font-weight="bold" fill="#00c8d8">LEVEL 3</text>

    <line x1="420" y1="210" x2="420" y2="252" stroke="#006888" stroke-width="0.6" opacity="0.4"/>

    <text x="450" y="220" text-anchor="middle" font-size="11" letter-spacing="1">PRIMARY</text>
    <text x="450" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#00c8d8">WIS</text>

    <line x1="490" y1="210" x2="490" y2="252" stroke="#006888" stroke-width="0.6" opacity="0.4"/>

    <text x="570" y="223" text-anchor="middle" font-size="11" letter-spacing="1">RESOURCE</text>
    <text x="570" y="243" text-anchor="middle" font-size="11" font-weight="bold" fill="#00c8d8">PLANAR REACH</text>

    <line x1="645" y1="210" x2="645" y2="252" stroke="#006888" stroke-width="0.6" opacity="0.4"/>

    <text x="725" y="223" text-anchor="middle" font-size="11" letter-spacing="1">SPELLS ADDED</text>
    <text x="725" y="243" text-anchor="middle" font-size="20" font-weight="bold" fill="#00c8d8" filter="url(#glow-soft)">9</text>
  </g>

  <!-- Tagline -->
  <text x="450" y="282" text-anchor="middle" font-family="'Palatino Linotype', Palatino, Georgia, serif" font-size="12" fill="#001525" font-style="italic">
    "Space is not an obstacle. It's a resource. You just learned how to spend it."
  </text>
</svg>
